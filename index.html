<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enquiry Follow-up Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container { 
            background: #fff; 
            padding: 40px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center;
        }
        .login-container h2 { margin-bottom: 24px; color: #333; font-weight: 600; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; font-weight: 500; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .login-btn { width: 100%; background: #007BFF; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 6px; font-size: 16px; font-weight: 600; }
        .login-btn:hover { background: #0056b3; }

        .dashboard { background: #fff; padding: 30px; border-radius: 12px; width: 100%; max-width: 1000px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: left; }
        th { background-color: #007BFF; color: white; font-weight: 500; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        input[type="text"], input[type="date"] { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;}
        .action-btn { background: #28a745; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-weight: 500; }
        .action-btn:hover { background: #218838; }
        .error-banner { background-color: #f8d7da; color: #721c24; padding: 12px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #f5c6cb; display: none; }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div id="loginSection" class="login-container">
        <h2>Staff Portal</h2>
        <div id="loginError" class="error-banner"></div>
        <div class="input-group">
            <label>Username / Name</label>
            <input type="text" id="username" placeholder="Enter your name">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        <button class="login-btn" onclick="handleLogin()">Sign In</button>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" class="dashboard hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px;">
            <h2>Today's Follow-ups (<span id="todayDate"></span>)</h2>
            <div>Logged in as: <strong id="loggedInUser" style="color: #007BFF;"></strong></div>
        </div>
        
        <div id="appError" class="error-banner"></div>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Details</th>
                    <th>New Remarks</th>
                    <th>Next Follow-up Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data injected dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        const WEB_APP_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";
        let currentUser = "";

        function handleLogin() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value;
            const errorDiv = document.getElementById("loginError");

            errorDiv.style.display = "none";

            if (pass === "mayank" && user !== "") {
                currentUser = user; 
                document.getElementById("loggedInUser").innerText = currentUser;
                document.getElementById("loginSection").classList.add("hidden");
                document.getElementById("dashboardSection").classList.remove("hidden");
                
                document.getElementById("todayDate").innerText = new Date().toISOString().split('T')[0];
                loadData();
            } else {
                errorDiv.innerText = "Invalid username or password. (Password is 'mayank')";
                errorDiv.style.display = "block";
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById("appError");
            errorDiv.innerText = "Error: " + message;
            errorDiv.style.display = "block";
        }

        function loadData() {
            const errorDiv = document.getElementById("appError");
            errorDiv.style.display = "none";

            fetch(WEB_APP_URL)
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById("tableBody");
                    tbody.innerHTML = "";
                    
                    if(data.error) {
                        showError(data.error);
                        return;
                    }

                    if(data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: #777;">No follow-ups scheduled for today!</td></tr>`;
                        return;
                    }

                    data.forEach(row => {
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td>${row.Name || ''}</td>
                            <td>${row.Phone || ''}</td>
                            <td>${row.Enquiry Details || ''}</td>
                            <td><input type="text" id="remarks_${row.rowIndex}" value="${row.Remarks || ''}"></td>
                            <td><input type="date" id="date_${row.rowIndex}" value="${row.Followup Date || ''}"></td>
                            <td><button class="action-btn" onclick="updateRow(${row.rowIndex})">Update</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    console.error("Error loading data:", err);
                    showError("Failed to connect to backend script.");
                });
        }

        function updateRow(rowIndex) {
            const remarks = document.getElementById(`remarks_${rowIndex}`).value;
            const followupDate = document.getElementById(`date_${rowIndex}`).value;

            const payload = {
                rowIndex: rowIndex,
                remarks: remarks,
                followupDate: followupDate,
                updatedBy: currentUser 
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(result => {
                if(result.status === "success") {
                    alert("Updated successfully!");
                    loadData(); 
                } else {
                    showError(result.error || "Failed to update record.");
                }
            })
            .catch(err => {
                console.error("Error updating:", err);
                showError("Failed to communicate with server during update.");
            });
        }
    </script>
</body>
</html>
