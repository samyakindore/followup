<!-- LOGIN -->
<div id="loginSection" class="login-container">

    <h2>Staff Portal</h2>

    <div id="loginError" class="error-banner"></div>

    <div class="input-group">
        <label>Username / Name</label>
        <input

        >

            placeholder="Enter password"
            onkeydown="if(event.key === 'Enter') handleLogin()"
        >
    </div>

    <button class="login-btn" onclick="handleLogin()">
        Sign In
    </button>

</div>


<!-- DASHBOARD -->
<div id="dashboardSection" class="dashboard hidden">

    <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;

        margin-bottom:20px;

        <div>

<script>

/* =========================================================
   GOOGLE APPS SCRIPT WEB APP URL
   ========================================================= */

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxsQU8YADim0Y2YFBCcD7XW-oVoprJXNShRPGcTpFSQwnK4SLaVRaHrfKK7NRNR-lcKoA/exec";


let currentUser = "";


/* =========================================================
   LOGIN
   ========================================================= */

function handleLogin() {

    const user =
        document.getElementById("username").value.trim();

    const pass =
        document.getElementById("password").value;

    const errorDiv =
        document.getElementById("loginError");


    errorDiv.style.display = "none";


    if (user === "") {

        errorDiv.innerText =
            "Please enter your username.";

        errorDiv.style.display = "block";

        return;
    }


    if (pass !== "mayank") {

        errorDiv.innerText =
            "Invalid password. Please enter the correct password.";

        errorDiv.style.display = "block";

        return;
    }


    /* LOGIN SUCCESS */

    currentUser = user;


    document.getElementById("loggedInUser").innerText =
        currentUser;


    document.getElementById("loginSection")
        .classList.add("hidden");


    document.getElementById("dashboardSection")
        .classList.remove("hidden");


    /* Use local date instead of UTC */

    const today = new Date();

    const yyyy =
        today.getFullYear();

    const mm =
        String(today.getMonth() + 1).padStart(2, "0");

    const dd =
        String(today.getDate()).padStart(2, "0");


    document.getElementById("todayDate").innerText =
        `${yyyy}-${mm}-${dd}`;


    loadData();
}


/* =========================================================
   ERROR MESSAGE
   ========================================================= */

function showError(message) {

    const errorDiv =
        document.getElementById("appError");

    errorDiv.innerText =
        "Error: " + message;

    errorDiv.style.display =
        "block";
}


/* =========================================================
   SUCCESS MESSAGE
   ========================================================= */

function showSuccess(message) {

    const successDiv =
        document.getElementById("successMessage");

    successDiv.innerText =
        message;

    successDiv.style.display =
        "block";


    setTimeout(function() {

        successDiv.style.display =
            "none";

    }, 3000);
}


/* =========================================================
   LOAD TODAY'S DATA
   ========================================================= */

function loadData() {

    const errorDiv =
        document.getElementById("appError");

    errorDiv.style.display =
        "none";


    const tbody =
        document.getElementById("tableBody");


    tbody.innerHTML =
        '<tr><td colspan="6" class="loading">Loading follow-ups...</td></tr>';


    fetch(WEB_APP_URL)

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "Server returned HTTP " + response.status
                );

            }

            return response.json();

        })

        .then(function(data) {

            tbody.innerHTML = "";


            if (data.error) {

                showError(data.error);

                return;
            }


            if (!Array.isArray(data)) {

                showError(
                    "Invalid data received from Google Apps Script."
                );

                return;
            }


            if (data.length === 0) {

                tbody.innerHTML = `
                    <tr>
                        <td colspan="6"
                            style="text-align:center; color:#777; padding:30px;">
                            No follow-ups scheduled for today!
                        </td>
                    </tr>
                `;

                return;
            }


            data.forEach(function(row) {

                const tr =
                    document.createElement("tr");


                /*
                 IMPORTANT:
                 Column names containing spaces MUST use:
                 row["Enquiry Details"]
                 row["Followup Date"]
                 row["Remarks"]
                */


                const name =
                    row["Name"] || "";

                const phone =
                    row["Phone"] || "";

                const details =
                    row["Enquiry Details"] || "";

                const remarks =
                    row["Remarks"] || "";

                const followupDate =
                    formatDateForInput(row["Followup Date"]);


                tr.innerHTML = `

                    <td>${escapeHtml(name)}</td>

                    <td>${escapeHtml(phone)}</td>

                    <td>${escapeHtml(details)}</td>

                    <td>
                        <input
                            type="text"
                            id="remarks_${row.rowIndex}"
                            value="${escapeHtml(remarks)}"
                        >
                    </td>

                    <td>
                        <input
                            type="date"
                            id="date_${row.rowIndex}"
                            value="${followupDate}"
                        >
                    </td>

                    <td>
                        <button
                            class="action-btn"
                            onclick="updateRow(${row.rowIndex})"
                        >
                            Update
                        </button>
                    </td>

                `;


                tbody.appendChild(tr);

            });

        })

        .catch(function(err) {

            console.error(
                "Error loading data:",
                err
            );

            tbody.innerHTML = "";

            showError(
                "Failed to connect to Google Apps Script. Check your Web App URL and deployment settings."
            );

        });
}


/* =========================================================
   UPDATE ROW
   ========================================================= */

function updateRow(rowIndex) {

    const remarksInput =
        document.getElementById(
            `remarks_${rowIndex}`
        );

    const dateInput =
        document.getElementById(
            `date_${rowIndex}`
        );


    const remarks =
        remarksInput
            ? remarksInput.value
            : "";


    const followupDate =
        dateInput
            ? dateInput.value
            : "";


    const payload = {

        rowIndex: rowIndex,

        remarks: remarks,

        followupDate: followupDate,

        updatedBy: currentUser

    };


    /*
       IMPORTANT:
       text/plain prevents the browser from
       sending a CORS preflight OPTIONS request.
    */

    fetch(WEB_APP_URL, {

        method: "POST",

        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },

        body: JSON.stringify(payload)

    })

    .then(function(response) {

        return response.json();

    })

    .then(function(result) {

        if (result.status === "success") {

            showSuccess(
                "Updated successfully!"
            );

            loadData();

        } else {

            showError(
                result.error ||
                "Failed to update record."
            );

        }

    })

    .catch(function(err) {

        console.error(
            "Error updating:",
            err
        );

        showError(
            "Failed to communicate with Google Apps Script."
        );

    });
}


/* =========================================================
   DATE FORMATTER
   ========================================================= */

function formatDateForInput(value) {

    if (!value) {
        return "";
    }


    /*
       Google Apps Script may return:
       Date object converted to string
       or yyyy-MM-dd
    */

    const stringValue =
        String(value);


    if (/^\d{4}-\d{2}-\d{2}$/.test(stringValue)) {

        return stringValue;

    }


    const date =
        new Date(value);


    if (isNaN(date.getTime())) {

        return "";

    }


    const yyyy =
        date.getFullYear();

    const mm =
        String(date.getMonth() + 1)
            .padStart(2, "0");

    const dd =
        String(date.getDate())
            .padStart(2, "0");


    return `${yyyy}-${mm}-${dd}`;
}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}

</script>
